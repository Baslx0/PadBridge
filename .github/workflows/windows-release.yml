name: Windows build

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package Windows ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadBridge-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'padbridge' | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw "Tag does not match Cargo version $($package.version)" }
          $files = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title $env:GITHUB_REF_NAME --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed.' }
