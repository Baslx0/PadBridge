[package]
name = "padbridge"
version = "0.2.0"
edition = "2021"
description = "A transparent, local-first Windows gamepad inspector"
license = "MIT"

[dependencies]
eframe = "0.29.1"
gilrs = "0.11.2"

serde = { version = '1', features = ['derive'] }
serde_json = '1'


hidapi = '2.6.7'

[target."cfg(windows)".dependencies]
vigem-client = "0.1.4"
